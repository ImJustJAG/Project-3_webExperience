<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <title>Yelo Car Vrrrooom</title>
  <meta name="description" content="Interactive web experience. Simple slot car demo.">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icon.png">
  <!-- Place favicon.ico in the root directory -->

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">
</head>

<body>
  <input class="ignition" type="checkbox" id="ignition" aria-label="Start or stop the car">
  <main class="scene">
    <label class="drive-button go-button" for="ignition">GO</label>
    <label class="drive-button stop-button" for="ignition">STOP</label>

    <div class="traffic-light" aria-label="Traffic light">
      <span class="light red-light"></span>
      <span class="light yellow-light"></span>
      <span class="light green-light"></span>
    </div>

    <div class="track-frame">
      <div class="track-canvas">
        <img class="racetrack" src="svgs%20%26%20images/RaceTrackSVG.svg" alt="Race track">
        <img class="yellow-car" src="svgs%20%26%20images/YellowCar.png" alt="Yellow car">
      </div>
    </div>
  </main>
</body>

</html>
